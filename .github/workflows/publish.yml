name: publish

# Release checklist (maintainer-facing; the vendored skill has its own notes in
# skill/README.md):
#   - bump "version" in package.json, then tag and push:
#       git commit -am "chore: release vX.Y.Z" && git tag -a vX.Y.Z -m vX.Y.Z
#       git push origin main && git push origin vX.Y.Z
#   - publish a Release for that tag (drafts do not trigger this workflow)
#   - dsh prereleases: node-semver only admits a prerelease when the range carries a
#     comparator with the *same* major.minor.patch, so every new dsh series needs its
#     own "|| ^<tuple>-rc.N" branch in peerDependencies. A range that looks broad
#     (">=0.0.1-rc.1 <0.2.0") silently excludes all prereleases and users hit ERESOLVE.
#   - an uncovered dsh version is not an error the user sees: app boot drops the bundle
#     into skippedBundles, so the tool, the prompt section and the skill all vanish with
#     no message. Check the published runtimes after a dsh update and add the missing
#     tuple with:
#       npm view @deepseek-ai/dsh dist-tags --json
on:
  # npm publish runs only when a stable GitHub Release is published;
  # pushing a tag alone (git push --tags) does NOT trigger this workflow.
  release:
    types: [released]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci || npm install
      - name: Quick load/regression check
        run: npm run check
      # Informational: the vendored skill is pinned on purpose, so a stale copy must
      # not block a plugin fix. The scheduled skill-drift workflow fails instead.
      - name: Report upstream skill drift
        continue-on-error: true
        run: node scripts/fetch-upstream-skill.mjs --check
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
