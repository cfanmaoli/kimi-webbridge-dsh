name: publish

on:
  # npm publish runs only when a stable GitHub Release is published;
  # pushing a tag alone (git push --tags) does NOT trigger this workflow.
  release:
    types: [released]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci || npm install
      - name: Quick load/regression check
        run: node --check lib/index.js
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
