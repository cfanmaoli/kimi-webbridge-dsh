name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci || npm install
      - name: Quick load/regression check
        run: node --check lib/index.js
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release with npm tarball
        run: |
          npm pack
          gh release create "$GITHUB_REF_NAME" --title "kimi-webbridge-dsh $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" kimi-webbridge-dsh-*.tgz
        env:
          GH_TOKEN: ${{ github.token }}
